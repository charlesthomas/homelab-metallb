---
apiVersion: v1
kind: Service
metadata:
  name: frr-k8s-webhook-service
  namespace: metallb
spec:
  ports:
  - port: 443
    targetPort: webhook
  selector:
    app.kubernetes.io/component: statuscleaner
---
apiVersion: v1
kind: Service
metadata:
  name: metallb-webhook-service
  namespace: metallb
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/instance: metallb
spec:
  ports:
  - port: 443
    targetPort: 9443
  selector:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/instance: metallb
    app.kubernetes.io/component: controller
